syntax = "proto3";
package Protocol;


option csharp_namespace = "Protocol";


import "Enum.proto";
import "Struct.proto";


// path = Login
message CT_Login
{
	string id = 1;
	int32 pw = 2;
}

// path = Login
message ST_Login
{
	bool success = 1;
	//repeated ObjectInfo players = 2;
}

// path = Room
message CT_EnterLobby
{
}

message ST_EnterLobby
{
	bool success = 1;
	uint64 playerId = 2;
}

// path = Server
message CT_ServerListRead
{
}

message ST_ServerListRead
{
	EResultCode result = 1;
    repeated ServerInfo serverInfoList = 2;
}